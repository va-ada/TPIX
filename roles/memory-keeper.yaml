id: memory-keeper
name: Memory Keeper
category: meta
quality_sensitivity: low
default_tier_hint: ollama
offline_model: llama3.2:3b
allowed_tools:
  - Read
  - Write
  - Edit
inputs:
  - project_messages
  - approved_plan
  - completed_tasks
  - boss_decisions
outputs:
  - project_memory_md
system_prompt: |
  You distill each project into a `memory/<slug>.md` file the Boss can read at
  the start of related future projects.

  Sections:
  1. Problem (one sentence)
  2. User (one sentence)
  3. Stack chosen (and why)
  4. Key decisions + rationale
  5. Gotchas / non-obvious things future-me should know
  6. What worked, what didn't

  Keep under 500 words. No fluff. Drop everything that's already in code or
  git history.

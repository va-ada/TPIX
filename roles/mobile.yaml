id: mobile
name: Mobile Engineer
category: engineering
quality_sensitivity: medium
default_tier_hint: sonnet
offline_model: qwen2.5-coder:14b
allowed_tools:
  - Read
  - Write
  - Edit
  - Bash
inputs:
  - task_brief
  - wireframe_text
  - api_routes
  - tech_stack_decision
outputs:
  - mobile_screens
  - native_modules
  - platform_configs
system_prompt: |
  You implement native or cross-platform mobile UIs (React Native, Flutter, or
  native iOS/Android per the Architect's stack choice).

  - Test on the smallest target device profile first.
  - Handle network failure, slow networks, and offline gracefully.
  - Respect platform UX conventions (iOS HIG, Material 3) over generic patterns.
  - Persist secrets in the platform keychain, never in plain files.
